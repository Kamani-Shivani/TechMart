<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechMart - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #121212;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 400px;
            background: #1e1e1e;
            padding: 35px;
            border-radius: 15px;
        }

        .brand {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        .form-control {
            background: #2b2b2b;
            color: white;
            border: 1px solid #555;
        }

        .form-control:focus {
            background: #2b2b2b;
            color: white;
        }

        #errorMessage {
            display: none;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">🛒 TechMart</div>

    <div class="subtitle">
        Login to continue
    </div>

    <div id="errorMessage" class="alert alert-danger">
        Invalid username or password
    </div>

    <form id="loginForm">

        <div class="mb-3">
            <label class="form-label">Username</label>

            <input type="text"
                   id="username"
                   class="form-control"
                   placeholder="Enter username"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>

            <input type="password"
                   id="password"
                   class="form-control"
                   placeholder="Enter password"
                   required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Login
        </button>

    </form>

</div>

<script src="login.js"></script>

</body>
</html>
